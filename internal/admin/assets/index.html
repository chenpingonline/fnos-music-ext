<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>fnMusic Go 控制台</title><link rel="stylesheet" href="/app/fnmusic-go/style.css"></head><body>
<div class="layout"><aside><div class="brand">♫ fnMusic <small>GO</small></div><nav><b>账号与访问设置</b><span>Go Native · MusicBox</span></nav><footer>v0.3.0-preview</footer></aside><main><header><div><label>FNOS MUSIC EXTENSION</label><h1>网易云账号管理</h1><p>飞牛用户隔离与共享账号选择</p></div><button id="refresh">刷新</button></header><div id="feedback"></div><section><div style="display:flex;justify-content:space-between;align-items:center"><h3>开启用户隔离</h3><input id="isolation" type="checkbox"></div><p id="explain">开启时按飞牛用户绑定账号，关闭时全部已验证用户使用下方选择的共享账号。</p><div id="shared-panel"><label>共享网易云账号</label><select id="shared"></select></div><div id="private-panel"><h3>绑定飞牛用户</h3><div class="fields"><input id="user-guid" placeholder="飞牛用户 GUID"><select id="bind-account"></select><button id="bind">绑定 / 解绑</button></div><div id="bindings"></div></div></section><section><h3>已添加账号</h3><p>每个账号需要自己的本机 MusicBox 服务和独立登录态</p><div id="accounts"></div><div class="fields"><input id="account-id" placeholder="账号标识，如 music_home"><input id="account-name" placeholder="显示名称"><input id="account-url" placeholder="http://127.0.0.1:8770" value="http://127.0.0.1:8770"><button id="add">添加</button></div></section><section><h3>代理状态</h3><pre id="diagnostic">加载中…</pre></section><p class="footnote">本页是无需 npm 的内嵌后备管理端。源码中同时包含 Vue 3 管理页面。扫码登录仍需另行配置 MusicBox。</p></main></div><script src="/app/fnmusic-go/app.js"></script></body></html>
