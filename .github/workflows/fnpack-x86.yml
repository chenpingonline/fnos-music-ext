name: Official fnOS x86 FPK
on:
  workflow_dispatch:
  push:
    paths:
      - .github/workflows/fnpack-x86.yml
      - scripts/build-fpk-x86.sh
      - scripts/build-fpk.sh
      - scripts/build-binaries.sh
      - scripts/version.sh
      - packaging/fpk/manifest.in
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install media test dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
      - name: Install official fnpack 1.2.3 (SHA256 checked)
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --location --retry 3 --connect-timeout 15 \
            https://static2.fnnas.com/fnpack/fnpack-1.2.3-linux-amd64 \
            --output "$RUNNER_TEMP/fnpack"
          echo "54b97fa7b70968c4d05c79840f5daeff508957d0bb2062fdb0376d00d9615c93  $RUNNER_TEMP/fnpack" | sha256sum -c -
          chmod +x "$RUNNER_TEMP/fnpack"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
      - name: Test and build
        run: |
          go test ./...
          go vet ./...
          npm ci --prefix web
          npm test --prefix web
          bash scripts/build-fpk-x86.sh
      - name: Upload official package
        uses: actions/upload-artifact@v4
        with:
          name: fnmusic-go-x86-fnpack
          path: dist/fnmusic-go-*-x86.fpk
          if-no-files-found: error